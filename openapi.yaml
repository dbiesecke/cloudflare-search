openapi: 3.1.1
info:
  title: Cloudflare Search
  version: 1.1.2
  description: Aggregated web search with per-provider diagnostics and MCP aliases.
servers:
  - url: /
    description: Deploy this contract on the configured Worker origin.
security:
  - bearerAuth: []
  - {}
paths:
  /search:
    get:
      operationId: searchWeb
      description: Search the default engines or an explicit selection. Provider failures preserve partial results.
      parameters:
        - name: q
          in: query
          description: Search text. Supply q or query.
          schema: {type: string, minLength: 1}
          example: Berlin techno events
        - name: query
          in: query
          description: Alternative to q.
          schema: {type: string, minLength: 1}
        - name: engines
          in: query
          description: Comma-separated engine names. Omit to use defaults. Google requires configured credentials.
          schema: {type: string}
          example: bing,duckduckgo
        - name: token
          in: query
          description: Legacy authentication token. Prefer a Bearer header.
          schema: {type: string}
      responses:
        '200': {$ref: '#/components/responses/SearchResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: searchWebForm
      description: Search using form fields. Supply q or query. Explicit engines restrict provider selection.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: {$ref: '#/components/schemas/SearchForm'}
            example: {q: Berlin techno events, engines: bing}
          multipart/form-data:
            schema: {$ref: '#/components/schemas/SearchForm'}
      responses:
        '200': {$ref: '#/components/responses/SearchResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /mcp:
    get:
      operationId: discoverMcp
      description: Describe the streamable HTTP MCP endpoint and available search tools.
      responses:
        '200':
          description: MCP endpoint metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: {type: string}
                  transport: {type: string, const: streamable-http}
                  endpoint: {type: string, const: /mcp}
                  tools:
                    type: array
                    items:
                      type: object
                      properties:
                        name: {type: string}
                        description: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: callMcp
      description: Accept initialize, tools/list, tools/call and notifications. Both search aliases share behavior.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {$ref: '#/components/schemas/RpcRequest'}
                - type: array
                  items: {$ref: '#/components/schemas/RpcRequest'}
            examples:
              search:
                value:
                  jsonrpc: '2.0'
                  id: 1
                  method: tools/call
                  params:
                    name: web_search
                    arguments: {query: Berlin techno events, engines: [bing]}
              initialize:
                value:
                  jsonrpc: '2.0'
                  id: 1
                  method: initialize
                  params: {protocolVersion: '2025-06-18', capabilities: {}, clientInfo: {name: search-client, version: '1.0'}}
      responses:
        '200':
          description: JSON-RPC response or batch. Tool results contain SearchResult in structuredContent.
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/RpcResponse'}
                  - type: array
                    items: {$ref: '#/components/schemas/RpcResponse'}
        '204': {description: Notification accepted without a response body.}
        '400': {description: Invalid JSON; returns a JSON-RPC parse error.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {description: Internal JSON-RPC error.}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, description: Required when TOKEN is configured.}
  schemas:
    SearchForm:
      type: object
      anyOf:
        - required: [q]
        - required: [query]
      properties:
        q: {type: string, minLength: 1}
        query: {type: string, minLength: 1}
        engines: {type: string, description: Comma-separated engine names.}
        token: {type: string, description: Legacy token; prefer the Authorization header.}
    Engine:
      type: string
      enum: [google, brave, duckduckgo, bing]
    EngineDiagnostic:
      type: object
      required: [engine, status, http_status, duration_ms, error_type, message]
      properties:
        engine: {$ref: '#/components/schemas/Engine'}
        status: {type: string, enum: [ok, empty, disabled, timeout, error]}
        http_status: {type: [integer, 'null'], description: Upstream error status; null otherwise.}
        duration_ms: {type: integer, minimum: 0}
        error_type:
          type: [string, 'null']
          enum: [missing_credentials, http_error, blocked, parser_error, timeout, provider_error, null]
          description: Block pages and unrecognized layouts are errors rather than empty success.
        message: {type: [string, 'null'], description: Credential-safe diagnostic; upstream bodies are omitted.}
    SearchResult:
      type: object
      required: [query, number_of_results, enabled_engines, unresponsive_engines, engine_diagnostics, results]
      properties:
        query: {type: string}
        number_of_results: {type: integer, minimum: 0}
        enabled_engines:
          type: array
          items: {$ref: '#/components/schemas/Engine'}
          description: Selected engines with available configuration.
        unresponsive_engines:
          type: array
          items: {$ref: '#/components/schemas/Engine'}
          description: Engines that failed or timed out. Empty results are separate.
        engine_diagnostics:
          type: array
          items: {$ref: '#/components/schemas/EngineDiagnostic'}
        results:
          type: array
          items:
            type: object
            required: [title, description, url, engine]
            properties:
              title: {type: string}
              description: {type: string}
              url: {type: string}
              engine: {$ref: '#/components/schemas/Engine'}
    RpcRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc: {type: string, const: '2.0'}
        id: {type: [string, number, 'null']}
        method: {type: string}
        params: {type: object, additionalProperties: true}
    RpcResponse:
      type: object
      required: [jsonrpc, id]
      properties:
        jsonrpc: {type: string, const: '2.0'}
        id: {type: [string, number, 'null']}
        result: {type: object, additionalProperties: true}
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: integer}
            message: {type: string}
            data: {}
  responses:
    SearchResponse:
      description: Aggregated results, including empty or partial success and provider diagnostics.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SearchResult'}
          examples:
            partialSuccess:
              value:
                query: Berlin techno events
                number_of_results: 1
                enabled_engines: [bing, brave, duckduckgo]
                unresponsive_engines: [brave, duckduckgo]
                engine_diagnostics:
                  - {engine: bing, status: ok, http_status: null, duration_ms: 200, error_type: null, message: null}
                  - {engine: google, status: disabled, http_status: null, duration_ms: 0, error_type: missing_credentials, message: Configure GOOGLE_API_KEY and GOOGLE_CX.}
                  - {engine: brave, status: error, http_status: 429, duration_ms: 140, error_type: http_error, message: Provider returned HTTP 429.}
                  - {engine: duckduckgo, status: error, http_status: 202, duration_ms: 200, error_type: blocked, message: Provider requires a browser challenge.}
                results:
                  - {title: Berlin event listing, description: Lineup and ticket information, url: 'https://example.org/events/berlin', engine: bing}
    BadRequest:
      description: Required query is missing.
      content:
        application/json:
          schema: {type: object, properties: {error: {type: string}, message: {type: string}}}
          example: {error: Missing query parameter, message: Please provide 'q' or 'query' parameter}
    Unauthorized:
      description: Missing or invalid configured token.
      content:
        application/json:
          schema: {type: object, properties: {error: {type: string}, message: {type: string}}}
          example: {error: Unauthorized, message: Invalid or missing authentication token}
